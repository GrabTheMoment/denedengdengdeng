version: '3.8'

services:
  silas-chat:
    build: .
    container_name: silas-chat
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - CHAT_BG_STORAGE_BUCKET=${CHAT_BG_STORAGE_BUCKET:-touxiang}
      - SILAS_PROACTIVE_ENABLED=${SILAS_PROACTIVE_ENABLED:-1}
      - SILAS_PROACTIVE_TZ=${SILAS_PROACTIVE_TZ:-Asia/Shanghai}
    volumes:
      - ./public:/app/public
    restart: unless-stopped
    networks:
      - silas-network

  nginx:
    image: nginx:alpine
    container_name: silas-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./public:/app/public:ro
    depends_on:
      - silas-chat
    restart: unless-stopped
    networks:
      - silas-network

networks:
  silas-network:
    driver: bridge
